name: Swift Tests

on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-build:
    name: RTMPHaishinKit macOS compile
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build RTMPHaishinKit for macOS
        shell: bash
        run: |
          set +e
          mkdir -p .build/test-results
          logger_info() {
            printf '\033[36m[info]\033[0m %s\n' "$1"
            echo "::notice title=Swift macOS Build::$1"
          }
          logger_error() {
            printf '\033[31m[error]\033[0m %s\n' "$1"
            echo "::error title=Swift macOS Build::$1"
          }
          logger_info "Building RTMPHaishinKit target for macOS"
          swift build --target RTMPHaishinKit 2>&1 | tee .build/test-results/macos-build.log
          status=${PIPESTATUS[0]}
          if [ "${status}" -eq 0 ]; then
            logger_info "RTMPHaishinKit macOS compile passed"
          else
            logger_error "RTMPHaishinKit macOS compile failed"
          fi
          {
            echo "### RTMPHaishinKit macOS compile"
            echo
            echo "- Exit code: \`${status}\`"
            echo
            echo "<details><summary>Last 120 log lines</summary>"
            echo
            echo '```text'
            tail -n 120 .build/test-results/macos-build.log
            echo '```'
            echo
            echo "</details>"
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "${status}"

      - name: Upload macOS build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rtmp-macos-build-log
          path: .build/test-results/macos-build.log
          if-no-files-found: error

  rtmp-tests:
    name: RTMPHaishinKit iOS tests
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Print toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Run RTMP tests
        id: rtmp_tests
        shell: bash
        run: |
          set +e
          logger_info() {
            printf '\033[36m[info]\033[0m %s\n' "$1"
            echo "::notice title=Swift Tests::$1"
          }
          logger_error() {
            printf '\033[31m[error]\033[0m %s\n' "$1"
            echo "::error title=Swift Tests::$1"
          }
          logger_error_line() {
            printf '\033[31m[error]\033[0m %s\n' "$1"
          }
          extract_errors() {
            grep -n -E "^error:|^fatal error:|^/.+:[0-9]+:[0-9]+: error:|No such module|cannot find" "$1" | head -n 80 || true
          }
          mkdir -p .build/test-results
          scheme="HaishinKit-Package"
          test_target="RTMPHaishinKitTests"
          device_name="$(xcrun simctl list devices available | sed -n 's/^[[:space:]]*\(iPhone[^()]*\) (.*/\1/p' | head -n 1)"
          if [ -z "${device_name}" ]; then
            device_name="iPhone 17"
          fi
          destination="platform=iOS Simulator,name=${device_name},OS=latest"
          status=0
          : > .build/test-results/rtmp-tests.log
          : > .build/test-results/summary.md
          : > .build/test-results/failures.md
          rm -rf .build/test-results/RTMPHaishinKitTests.xcresult
          logger_info "Using iOS Simulator destination: ${destination}"
          logger_info "Running ${test_target} with ${scheme} on iOS Simulator"
          xcodebuild test \
            -scheme "${scheme}" \
            -destination "${destination}" \
            -only-testing:"${test_target}" \
            -resultBundlePath .build/test-results/RTMPHaishinKitTests.xcresult \
            2>&1 | bash .github/scripts/colorize-test-log.sh | tee .build/test-results/ios-tests.log
          status=${PIPESTATUS[0]}
          cat .build/test-results/ios-tests.log >> .build/test-results/rtmp-tests.log
          if [ "${status}" -eq 0 ]; then
            logger_info "RTMPHaishinKit iOS tests passed"
            printf '\033[32m[pass]\033[0m RTMPHaishinKit iOS tests\n'
            echo "- PASS: full RTMPHaishinKit iOS test suite" >> .build/test-results/summary.md
          else
            logger_error "RTMPHaishinKit iOS tests failed with exit code ${status}"
            logger_error_line "Failed tests and compiler diagnostics are summarized in the next step"
            {
              echo "- FAIL: full RTMPHaishinKit iOS test suite, exit code \`${status}\`"
              echo
              echo "#### Diagnostics"
              extract_errors .build/test-results/ios-tests.log
              grep -n -E "Test Case '-\\[.*\\]' failed|failed:|Failure|Issue recorded|Test Suite .* failed|Failing tests:" .build/test-results/ios-tests.log | head -n 120 || true
            } >> .build/test-results/failures.md
          fi
          echo "${status}" > .build/test-results/exit-code

      - name: Extract RTMP failed tests
        if: always()
        shell: bash
        run: |
          status="$(cat .build/test-results/exit-code 2>/dev/null || echo 1)"
          if [ "${status}" -eq 0 ]; then
            echo "RTMPHaishinKit iOS tests passed; no failure extraction needed."
          else
            bash .github/scripts/summarize-swift-testing-failures.sh \
              .build/test-results/ios-tests.log \
              .build/test-results/focused-failures.md \
              "RTMPHaishinKit iOS Tests"
          fi

      - name: Summarize failed suites
        if: always()
        shell: bash
        run: |
          logger_info() {
            printf '\033[36m[info]\033[0m %s\n' "$1"
            echo "::notice title=Swift Tests::$1"
          }
          logger_error() {
            printf '\033[31m[error]\033[0m %s\n' "$1"
            echo "::error title=Swift Tests::$1"
          }
          status="$(cat .build/test-results/exit-code 2>/dev/null || echo 1)"
          if [ "${status}" -eq 0 ]; then
            logger_info "All RTMPHaishinKit test suites passed"
          else
            logger_error "RTMPHaishinKit tests failed; see failed suite summary below"
          fi
          {
            echo "### RTMPHaishinKit iOS test suites"
            echo
            if [ -s .build/test-results/summary.md ]; then
              cat .build/test-results/summary.md
            fi
            if [ -s .build/test-results/failures.md ]; then
              echo
              echo "### Failure summary"
              cat .build/test-results/failures.md
            fi
            if [ -s .build/test-results/focused-failures.md ]; then
              echo
              echo "### Focused failure diagnostics"
              cat .build/test-results/focused-failures.md
            fi
            echo
            echo "- Final exit code: \`${status}\`"
            echo
            echo "<details><summary>Last 120 log lines</summary>"
            echo
            echo '```text'
            tail -n 120 .build/test-results/rtmp-tests.log
            echo '```'
            echo
            echo "</details>"
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "${status}"

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rtmp-swift-test-logs
          path: .build/test-results
          if-no-files-found: error

