              echo
              echo "#### Diagnostics"
              extract_errors "${result_dir}/macos-tests.log"
              grep -n -E "Test Case '-\\[.*\\]' failed|failed:|Failure|Issue recorded|Test Suite .* failed|Failing tests:" "${result_dir}/macos-tests.log" | head -n 120 || true
            } >> "${result_dir}/failures.md"
