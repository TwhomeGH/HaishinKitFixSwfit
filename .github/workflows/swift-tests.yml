name: Swift Tests

on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-build:
    name: RTMPHaishinKit macOS compile
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build RTMPHaishinKit for macOS
        shell: bash
        run: |
          set +e
          mkdir -p .build/test-results
          logger_info() {
            printf '\033[36m[info]\033[0m %s\n' "$1"
            echo "::notice title=Swift macOS Build::$1"
          }
          logger_error() {
            printf '\033[31m[error]\033[0m %s\n' "$1"
            echo "::error title=Swift macOS Build::$1"
          }
          logger_info "Building RTMPHaishinKit target for macOS"
          swift build --target RTMPHaishinKit 2>&1 | tee .build/test-results/macos-build.log
          status=${PIPESTATUS[0]}
          if [ "${status}" -eq 0 ]; then
            logger_info "RTMPHaishinKit macOS compile passed"
          else
            logger_error "RTMPHaishinKit macOS compile failed"
          fi
          {
            echo "### RTMPHaishinKit macOS compile"
            echo
            echo "- Exit code: \`${status}\`"
            echo
            echo "<details><summary>Last 120 log lines</summary>"
            echo
            echo '```text'
            tail -n 120 .build/test-results/macos-build.log
            echo '```'
            echo
            echo "</details>"
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "${status}"

      - name: Upload macOS build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rtmp-macos-build-log
          path: .build/test-results/macos-build.log
          if-no-files-found: error

  rtmp-tests:
    name: RTMPHaishinKit iOS tests
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Print toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Run RTMP tests
        id: rtmp_tests
        shell: bash
        run: |
          set +e
          logger_info() {
            printf '\033[36m[info]\033[0m %s\n' "$1"
            echo "::notice title=Swift Tests::$1"
          }
          logger_error() {
            printf '\033[31m[error]\033[0m %s\n' "$1"
            echo "::error title=Swift Tests::$1"
          }
          extract_errors() {
            grep -n -E "^error:|^fatal error:|^/.+:[0-9]+:[0-9]+: error:|No such module|cannot find" "$1" | head -n 80 || true
          }
          mkdir -p .build/test-results
          scheme="RTMPHaishinKit"
          device_name="$(xcrun simctl list devices available | sed -n 's/^[[:space:]]*\(iPhone[^()]*\) (.*/\1/p' | head -n 1)"
          if [ -z "${device_name}" ]; then
            device_name="iPhone 17"
          fi
          destination="platform=iOS Simulator,name=${device_name},OS=latest"
          suites=(
            "MD5Tests"
            "RTMPVideoFourCCTests"
            "HEVCDecoderConfigurationRecordTests"
            "AVCDecoderConfigurationRecordTests"
            "RTMPTimestampTests"
            "RTMPURLTests"
            "RTMPStatusTests"
            "RTMPChunkBufferTests"
            "RTMPConnectionTests"
            "FoundationExtensionTest"
            "AMFFoundationTests"
            "AMF0SerializerTests"
          )
          status=0
          failed_suites=()
          : > .build/test-results/rtmp-tests.log
          : > .build/test-results/summary.md
          : > .build/test-results/failures.md
          logger_info "Using iOS Simulator destination: ${destination}"
          logger_info "Building ${scheme} test bundle for iOS Simulator"
          xcodebuild build-for-testing \
            -scheme "${scheme}" \
            -destination "generic/platform=iOS Simulator" \
            2>&1 | tee .build/test-results/build.log
          build_status=${PIPESTATUS[0]}
          cat .build/test-results/build.log >> .build/test-results/rtmp-tests.log
          if [ "${build_status}" -ne 0 ]; then
            logger_error "Build failed before tests could run"
            {
              echo "- FAIL: build failed before test execution, exit code \`${build_status}\`"
              echo
              echo "#### Build errors"
              extract_errors .build/test-results/build.log
            } >> .build/test-results/failures.md
            echo "${build_status}" > .build/test-results/exit-code
            exit 0
          fi
          for suite in "${suites[@]}"; do
            log=".build/test-results/${suite}.log"
            echo "::group::${suite}"
            logger_info "Running ${suite}"
            echo "## ${suite}" | tee -a .build/test-results/rtmp-tests.log
            xcodebuild test \
              -scheme "${scheme}" \
              -destination "${destination}" \
              -only-testing:"RTMPHaishinKitTests/${suite}" \
              2>&1 | tee "${log}"
            suite_status=${PIPESTATUS[0]}
            cat "${log}" >> .build/test-results/rtmp-tests.log
            if [ "${suite_status}" -eq 0 ]; then
              logger_info "${suite} passed"
              printf '\033[32m[pass]\033[0m %s\n' "${suite}"
              echo "- PASS: \`${suite}\`" >> .build/test-results/summary.md
            else
              logger_error "${suite} failed with exit code ${suite_status}"
              echo "- FAIL: \`${suite}\` exit code \`${suite_status}\`" >> .build/test-results/summary.md
              failed_suites+=("${suite}")
              {
                echo
                echo "#### ${suite}"
                extract_errors "${log}"
                grep -n -E "failed|Failure|Issue recorded" "${log}" | head -n 80 || true
              } >> .build/test-results/failures.md
              status="${suite_status}"
            fi
            echo "::endgroup::"
          done
          if [ "${#failed_suites[@]}" -gt 0 ]; then
            printf '%s\n' "${failed_suites[@]}" > .build/test-results/failed-suites.txt
          else
            : > .build/test-results/failed-suites.txt
          fi
          echo "${status}" > .build/test-results/exit-code

      - name: Summarize failed suites
        if: always()
        shell: bash
        run: |
          logger_info() {
            printf '\033[36m[info]\033[0m %s\n' "$1"
            echo "::notice title=Swift Tests::$1"
          }
          logger_error() {
            printf '\033[31m[error]\033[0m %s\n' "$1"
            echo "::error title=Swift Tests::$1"
          }
          status="$(cat .build/test-results/exit-code 2>/dev/null || echo 1)"
          if [ "${status}" -eq 0 ]; then
            logger_info "All RTMPHaishinKit test suites passed"
          else
            logger_error "RTMPHaishinKit tests failed; see failed suite summary below"
            if [ -s .build/test-results/failed-suites.txt ]; then
              while IFS= read -r suite; do
                logger_error "Failed suite: ${suite}"
              done < .build/test-results/failed-suites.txt
            fi
          fi
          {
            echo "### RTMPHaishinKit iOS test suites"
            echo
            if [ -s .build/test-results/summary.md ]; then
              cat .build/test-results/summary.md
            fi
            if [ -s .build/test-results/failures.md ]; then
              echo
              echo "### Failure summary"
              cat .build/test-results/failures.md
            fi
            echo
            echo "- Final exit code: \`${status}\`"
            echo
            echo "<details><summary>Last 120 log lines</summary>"
            echo
            echo '```text'
            tail -n 120 .build/test-results/rtmp-tests.log
            echo '```'
            echo
            echo "</details>"
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "${status}"

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rtmp-swift-test-logs
          path: .build/test-results
          if-no-files-found: error
