          logger_info() {
            printf '\033[36m[info]\033[0m %s\n' "$1"
            echo "::notice title=HaishinKit macOS Tests::$1"
          }
          logger_error() {
            printf '\033[31m[error]\033[0m %s\n' "$1"
            echo "::error title=HaishinKit macOS Tests::$1"
